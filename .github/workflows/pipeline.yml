name: Pipeline de series

# Calcula las series por zona y abre un PR con los datos nuevos (nunca hace push a main).
#  · (A) pipeline ABIERTO (Open-Meteo/ERA5 + MODIS): corre siempre, sin credenciales.
#  · (B) pipeline GEE (Sentinel-2/Landsat): solo si existe el secreto GEE_SA_JSON.
# Requisito del repo: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: '17 6 8 * *'   # mensual, día 8 (M-1 y M-2 se recalculan siempre)
    - cron: '17 6 * * *'   # diario: solo continúa un backfill incompleto (cuota gratuita de Open-Meteo ≈ 36 celdas/día)
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Reconstruir todo (--forzar)'
        type: boolean
        default: false
      solo_abierto:
        description: 'Saltar el pipeline GEE aunque exista el secreto'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pipeline-series
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GEE_SA_JSON: ${{ secrets.GEE_SA_JSON }}   # vacío si no está definido; nunca se imprime ni se commitea
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ¿Hace falta correr? (los disparos diarios solo completan un backfill pendiente)
        id: decidir
        run: |
          HOY=$(date -u +%d)
          COMPLETO=false
          if [ -f data/series/manifest.json ]; then
            COMPLETO=$(node -e "const m=require('./data/series/manifest.json');console.log(!!m.completo)")
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "17 6 * * *" ] \
             && [ "$HOY" != "08" ] && [ "$COMPLETO" = "true" ]; then
            echo "correr=false" >> "$GITHUB_OUTPUT"; echo "Backfill completo y no es día 8: nada que hacer."
          else
            echo "correr=true" >> "$GITHUB_OUTPUT"
          fi

      - name: (A) Pipeline abierto — Open-Meteo/ERA5 + MODIS
        if: steps.decidir.outputs.correr == 'true'
        run: |
          node scripts/pipeline/open/run.mjs --max-espera-hora-min=60 \
            ${{ inputs.forzar && '--forzar' || '' }}

      - name: (A2) Capas sociales abiertas — mensual o manual (OSM/Overpass, FIRMS, RWI, WorldPop)
        if: steps.decidir.outputs.correr == 'true' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 8 * *')
        run: |
          npm ci
          node scripts/pipeline/open/rwi.mjs
          node scripts/pipeline/open/firms.mjs
          node scripts/pipeline/open/sociales.mjs
          node scripts/pipeline/manifest.mjs

      - name: (B) Pipeline GEE — Sentinel-2 NDVI y Landsat LST
        if: steps.decidir.outputs.correr == 'true' && env.GEE_SA_JSON != '' && !inputs.solo_abierto
        run: |
          node scripts/pipeline/gee/run.mjs ${{ inputs.forzar && '--forzar' || '' }}

      - name: Verificar forma y plausibilidad de las series
        if: steps.decidir.outputs.correr == 'true'
        run: node scripts/pipeline/verificar.mjs

      - name: Abrir/actualizar PR con los datos nuevos
        if: steps.decidir.outputs.correr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RAMA=pipeline/series
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/pipeline/sync-public.mjs
          git add data/series public/series
          if git diff --cached --quiet; then echo "Sin cambios en data/series."; exit 0; fi
          git checkout -B "$RAMA"
          git commit -m "data: series actualizadas por el pipeline ($(date -u +%F))"
          git push --force origin "$RAMA"
          if gh pr view "$RAMA" >/dev/null 2>&1; then
            echo "PR existente actualizado por el push."
          else
            gh pr create --head "$RAMA" --base "${{ github.event.repository.default_branch }}" \
              --title "data: series del pipeline" \
              --body "Series regeneradas por \`.github/workflows/pipeline.yml\`. Revisar \`data/series/manifest.json\` (versión, pendientes, checksum). Ver docs/pipeline.md."
          fi
